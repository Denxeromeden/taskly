# Set JOB_NAME to train-<run-suffix> and ML_JOBS_IMAGE to an immutable Git-SHA image.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ml-jobs
  labels:
    app.kubernetes.io/name: training
    app.kubernetes.io/part-of: mlflowops
    app.kubernetes.io/managed-by: github-actions
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: training
        app.kubernetes.io/part-of: mlflowops
    spec:
      serviceAccountName: training
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        workload: training
      tolerations:
        - key: workload
          operator: Equal
          value: training
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: training
          image: ${ML_JOBS_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - python
            - jobs/entrypoint.py
            - train
          env:
            - name: TASKS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tasks-db-credentials
                  key: host
            - name: TASKS_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: tasks-db-credentials
                  key: port
            - name: TASKS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: tasks-db-credentials
                  key: dbname
            - name: TASKS_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tasks-db-credentials
                  key: username
            - name: TASKS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasks-db-credentials
                  key: password
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
