# Set JOB_NAME to a unique staging-smoke-<run-suffix> name and ML_JOBS_IMAGE to
# an immutable Git-SHA image. The pod label must match the selector-scoped
# ingress rule in the staging serving NetworkPolicy.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ml-jobs
  labels:
    app.kubernetes.io/name: staging-smoke
    app.kubernetes.io/part-of: mlflowops
    app.kubernetes.io/managed-by: github-actions
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: staging-smoke
        app.kubernetes.io/part-of: mlflowops
    spec:
      serviceAccountName: training
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: staging-smoke
          image: ${ML_JOBS_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - python
            - jobs/smoke_staging.py
          env:
            - name: SERVING_BASE_URL
              value: http://serving-api.staging.svc.cluster.local:8000
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: MODEL_NAME
              value: task-priority-classifier
            - name: READY_TIMEOUT_SECONDS
              value: "120"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
