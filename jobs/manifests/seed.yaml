# Set JOB_NAME to a unique seed-<run-id> name and ML_JOBS_IMAGE to a scanned Git-SHA image.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ml-jobs
  labels:
    app.kubernetes.io/name: seed
    app.kubernetes.io/part-of: mlflowops
    app.kubernetes.io/managed-by: github-actions
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
        app.kubernetes.io/part-of: mlflowops
    spec:
      serviceAccountName: seed
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ${ML_JOBS_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - python
            - jobs/entrypoint.py
            - seed
          env:
            - name: TASKS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tasks-db-credentials
                  key: host
            - name: TASKS_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: tasks-db-credentials
                  key: port
            - name: TASKS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: tasks-db-credentials
                  key: dbname
            - name: TASKS_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tasks-db-credentials
                  key: username
            - name: TASKS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasks-db-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
