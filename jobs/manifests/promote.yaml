# Set JOB_NAME to promote-<run-suffix> and ML_JOBS_IMAGE to an immutable Git-SHA image.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ml-jobs
  labels:
    app.kubernetes.io/name: promotion
    app.kubernetes.io/part-of: mlflowops
    app.kubernetes.io/managed-by: github-actions
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promotion
        app.kubernetes.io/part-of: mlflowops
    spec:
      serviceAccountName: training
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: promotion
          image: ${ML_JOBS_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - python
            - jobs/promote.py
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: MODEL_NAME
              value: task-priority-classifier
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
