apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-jobs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
    targetRevision: {{ required "targetRevision is required" .Values.targetRevision | quote }}
    path: deploy/charts/ml-jobs
    helm:
      releaseName: ml-jobs
      valueFiles:
        - values-image.yaml
      parameters:
        - name: image.repository
          value: {{ regexReplaceAll "/mlflow$" (required "mlflowImageRepository is required" .Values.mlflowImageRepository) "/ml-jobs" | quote }}
          forceString: true
        - name: artifactsBucket
          value: {{ required "mlflowArtifactsBucket is required" .Values.mlflowArtifactsBucket | quote }}
          forceString: true
        - name: region
          value: {{ required "mlflowRegion is required" .Values.mlflowRegion | quote }}
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-jobs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
