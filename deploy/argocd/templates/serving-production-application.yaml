{{- if .Values.applications.servingProduction.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serving-production
  namespace: argocd
spec:
  project: serving
  source:
    repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
    targetRevision: {{ required "targetRevision is required" .Values.targetRevision | quote }}
    path: deploy/charts/serving
    helm:
      releaseName: serving-api
      valueFiles:
        - values-image.yaml
        - values-production.yaml
      parameters:
        - name: image.repository
          value: {{ required "servingImageRepository is required" .Values.servingImageRepository | quote }}
          forceString: true
        - name: gateway.certificateArn
          value: {{ required "certificateArn is required" .Values.certificateArn | quote }}
          forceString: true
        - name: networkPolicy.publicSubnetCidrs
          value: {{ required "publicSubnetCidrs is required" (join "," .Values.publicSubnetCidrs) | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  # `kubectl rollout restart` writes this single runtime annotation. Ignore it
  # so Argo CD self-heal does not undo a restart after model alias promotion.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: serving-api
      namespace: production
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
{{- end }}
