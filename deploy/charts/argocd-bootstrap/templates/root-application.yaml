apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflowops-root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: deploy/argocd
    helm:
      parameters:
        - name: repoURL
          value: {{ .Values.repoURL | quote }}
          forceString: true
        - name: targetRevision
          value: {{ .Values.targetRevision | quote }}
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
