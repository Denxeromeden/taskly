apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflowops-root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
    targetRevision: {{ required "targetRevision is required" .Values.targetRevision | quote }}
    path: deploy/argocd
    helm:
      parameters:
        - name: repoURL
          value: {{ required "repoURL is required" .Values.repoURL | quote }}
          forceString: true
        - name: targetRevision
          value: {{ required "targetRevision is required" .Values.targetRevision | quote }}
          forceString: true
        - name: mlflowImageRepository
          value: {{ required "mlflowImageRepository is required" .Values.mlflowImageRepository | quote }}
          forceString: true
        - name: mlflowRegion
          value: {{ required "mlflowRegion is required" .Values.mlflowRegion | quote }}
          forceString: true
        - name: mlflowArtifactsBucket
          value: {{ .Values.mlflowArtifactsBucket | quote }}
          forceString: true
        - name: servingImageRepository
          value: {{ required "servingImageRepository is required" .Values.servingImageRepository | quote }}
          forceString: true
        - name: certificateArn
          value: {{ required "certificateArn is required" .Values.certificateArn | quote }}
          forceString: true
{{- /* Emit one indexed Helm parameter per subnet CIDR so the value remains a YAML list. */ -}}
{{- range $index, $cidr := .Values.publicSubnetCidrs }}
        - name: publicSubnetCidrs[{{ $index }}]
          value: {{ $cidr | quote }}
          forceString: true
{{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
