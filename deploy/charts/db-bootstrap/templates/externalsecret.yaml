apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.mlflowSecretName | quote }}
  namespace: ml-jobs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStoreName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.mlflowSecretName | quote }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.mlflowRemoteSecretName | quote }}
        