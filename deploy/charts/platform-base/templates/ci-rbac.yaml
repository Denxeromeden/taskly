apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflowops-deployer
  namespace: ml-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflowops-deployer
  namespace: ml-jobs
subjects:
  - kind: Group
    name: mlflowops:deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlflowops-deployer
  apiGroup: rbac.authorization.k8s.io
---
{{- range $ns := list "staging" "production" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflowops-deployer
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # `kubectl rollout status` watches the Deployment object.
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  {{- if eq $ns "production" }}
  # Read-only Gateway status so the protected release can resolve the public
  # ALB DNS name before running the production verification Job.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflowops-deployer
  namespace: {{ $ns }}
subjects:
  - kind: Group
    name: mlflowops:deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlflowops-deployer
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
