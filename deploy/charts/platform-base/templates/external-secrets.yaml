  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: mlflow-db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.rdsMlflowSecretName | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
