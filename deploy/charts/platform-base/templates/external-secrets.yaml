apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-master
  namespace: ml-jobs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: rds-master
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.rdsMasterSecretArn | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
