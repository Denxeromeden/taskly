namespace: production
replicaCount: 2

model:
  alias: production

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

gateway:
  enabled: true
  # Supply the ACM certificate ARN from the platform Terraform output.
  certificateArn: ""

serviceMonitor:
  enabled: true
  interval: 30s

networkPolicy:
  # Supply at render/deploy time from the infra Terraform public_subnet_cidrs output.
  publicSubnetCidrs: []
  allowMonitoring: true
