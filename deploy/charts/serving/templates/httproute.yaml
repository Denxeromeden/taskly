{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: serving-public
  namespace: {{ .Values.namespace | quote }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: serving-public
      sectionName: https
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /predict
      backendRefs:
        - kind: Service
          name: serving-api
          port: 8000
{{- end }}
