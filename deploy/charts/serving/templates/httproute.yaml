{{- if .Values.gateway.enabled }}
{{- /* This is the only public application route. Do not add /health, /ready,
       /metrics, /docs, /openapi.json, / or a catch-all match here. */ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: serving-public
  namespace: {{ .Values.namespace | quote }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: serving-public
      sectionName: https
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /predict
      backendRefs:
        - group: ""
          kind: Service
          name: serving-api
          port: 8000
          weight: 1
{{- end }}
