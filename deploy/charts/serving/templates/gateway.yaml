{{- if .Values.gateway.enabled }}
{{- if ne .Values.namespace "production" }}
{{- fail "gateway.enabled is only valid when namespace is production" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: serving-public
  namespace: {{ .Values.namespace | quote }}
spec:
  gatewayClassName: aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: serving-public-lb
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Same
{{- end }}
