{{- if eq .Values.namespace "production" }}
{{- $cidrs := required "networkPolicy.publicSubnetCidrs must be set from the infra Terraform public_subnet_cidrs output for production" .Values.networkPolicy.publicSubnetCidrs }}
{{- if not $cidrs }}
{{- fail "networkPolicy.publicSubnetCidrs must contain at least one infra public-subnet CIDR for production" }}
{{- end }}
{{- /* Accept only IPv4 CIDRs with a non-zero prefix. This rejects 0.0.0.0/0,
       ::/0 and arbitrary non-CIDR strings instead of silently widening the
       serving pod ingress policy. */ -}}
{{- $cidrPattern := "^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/([1-9]|[12][0-9]|3[0-2])$" }}
{{- $allAddressCidrs := list "0.0.0.0/0" "::/0" }}
{{- range $cidr := $cidrs }}
{{- $value := toString $cidr }}
{{- if has $value $allAddressCidrs }}
{{- fail "networkPolicy.publicSubnetCidrs must contain only the ALB public-subnet CIDRs; an all-address CIDR is not allowed" }}
{{- end }}
{{- if not (regexMatch $cidrPattern $value) }}
{{- fail (printf "networkPolicy.publicSubnetCidrs entry %q must be a valid IPv4 CIDR with a prefix between /1 and /32" $value) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: serving-api-ingress
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: serving-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: serving-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range $cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if .Values.networkPolicy.allowMonitoring }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
{{- else if eq .Values.namespace "staging" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: serving-api-ingress
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: serving-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: serving-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.allowStagingSmoke }}
    # Selector-scoped exception for the ephemeral staging-smoke Job in ml-jobs.
    # It does not grant access to any other pod in that namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-jobs
          podSelector:
            matchLabels:
              app.kubernetes.io/name: staging-smoke
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
    {{- if .Values.networkPolicy.allowMonitoring }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
{{- else }}
{{- fail "serving chart namespace must be staging or production" }}
{{- end }}
