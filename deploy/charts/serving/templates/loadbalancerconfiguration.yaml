{{- if .Values.gateway.enabled }}
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: serving-public-lb
  namespace: {{ .Values.namespace | quote }}
spec:
  scheme: internet-facing
  # Public ALB client ingress is intentionally open, per the foundation
  # contract. Pod ingress is separately restricted to the ALB public-subnet
  # CIDRs by the serving NetworkPolicy; do not widen that pod policy.
  sourceRanges:
    - 0.0.0.0/0
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: {{ required "gateway.certificateArn must be set to the ACM certificate ARN from the platform Terraform output" .Values.gateway.certificateArn | quote }}
{{- end }}
