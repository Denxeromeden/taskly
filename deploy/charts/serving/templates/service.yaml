apiVersion: v1
kind: Service
metadata:
  name: serving-api
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "serving.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "serving.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
