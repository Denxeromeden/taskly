{{- if .Values.gateway.enabled }}
{{- /* The ALB is an L7 proxy, so pod ingress originates from ALB nodes in the
       public subnets. The serving NetworkPolicy allows only those CIDRs. */ -}}
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: serving-api-targets
  namespace: {{ .Values.namespace | quote }}
spec:
  targetReference:
    group: ""
    kind: Service
    name: serving-api
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckProtocol: HTTP
      healthCheckPath: /health
      healthCheckPort: "8000"
      matcher:
        httpCode: "200"
{{- end }}
