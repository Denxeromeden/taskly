apiVersion: v1
kind: ConfigMap
metadata:
  name: serving-config
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "serving.labels" . | nindent 4 }}
data:
  MLFLOW_TRACKING_URI: {{ .Values.mlflow.trackingUri | quote }}
  MODEL_NAME: {{ .Values.model.name | quote }}
  MODEL_ALIAS: {{ .Values.model.alias | quote }}
