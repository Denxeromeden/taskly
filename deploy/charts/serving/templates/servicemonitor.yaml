{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: serving-api
  namespace: {{ .Values.namespace | quote }}
  labels:
    release: monitoring
    app.kubernetes.io/name: serving-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/name: serving-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval | default "30s" | quote }}
      scheme: http
{{- end }}
