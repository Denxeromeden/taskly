{{- range $name := .Values.serviceAccounts }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name | quote }}
  labels:
    app.kubernetes.io/name: ml-jobs
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name | quote }}
automountServiceAccountToken: false
---
{{- end }}
