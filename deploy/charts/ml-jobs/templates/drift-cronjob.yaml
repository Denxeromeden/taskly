{{- if .Values.drift.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-jobs-drift-detection
  labels:
    app.kubernetes.io/name: ml-jobs
    app.kubernetes.io/component: drift
spec:
  schedule: {{ .Values.drift.schedule | quote }}
  suspend: {{ .Values.drift.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ml-jobs
            app.kubernetes.io/component: drift
        spec:
          serviceAccountName: drift
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drift
              image: "{{ required "ml-jobs image repository is required" .Values.image.repository }}:{{ required "ml-jobs image tag is required" .Values.image.tag }}"
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "jobs.drift"]
              env:
                - name: TASKS_DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: tasks-db-credentials
                      key: host
                - name: TASKS_DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: tasks-db-credentials
                      key: port
                - name: TASKS_DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: tasks-db-credentials
                      key: dbname
                - name: TASKS_DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: tasks-db-credentials
                      key: username
                - name: TASKS_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tasks-db-credentials
                      key: password
                - name: MLFLOW_TRACKING_URI
                  value: {{ .Values.mlflowTrackingUri | quote }}
                - name: MODEL_NAME
                  value: {{ .Values.modelName | quote }}
                - name: ARTIFACTS_BUCKET
                  value: {{ required "artifact bucket is required" .Values.artifactsBucket | quote }}
                - name: AWS_REGION
                  value: {{ required "AWS region is required" .Values.region | quote }}
                - name: PUSHGATEWAY_URL
                  value: {{ .Values.drift.pushgatewayUrl | quote }}
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              resources:
                {{- toYaml .Values.drift.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
