name: CI security

on:
  workflow_dispatch:
#  pull_request:
#    branches:
#      - main
#  push:
#    branches:
#      - main

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            model/requirements.txt
            images/mlflow/requirements.txt
            serving/requirements.txt
            constraints/ml-runtime.txt

      - name: Install project runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check \
            -r model/requirements.txt \
            -c constraints/ml-runtime.txt
          python -m pip install --disable-pip-version-check \
            -r images/mlflow/requirements.txt \
            -c constraints/ml-runtime.txt
          python -m pip install --disable-pip-version-check \
            -r serving/requirements.txt \
            -c constraints/ml-runtime.txt
          python -m pip check

      - name: Run Taskly, ML jobs and serving unit tests
        run: python -m pytest -q tests serving/tests

  dependency-audit:
    name: pip-audit runtime dependency sets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install pinned pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit Taskly API runtime dependencies
        run: pip-audit --requirement requirements.txt

      - name: Audit MLflow, jobs and serving runtime dependencies
        # Report known advisories without blocking CI; unexpected audit errors still fail the step.
        shell: bash
        run: |
          set -euo pipefail
          if pip-audit \
              --requirement model/requirements.txt \
              --requirement constraints/ml-runtime.txt \
              --requirement images/mlflow/requirements.txt \
              --requirement serving/requirements.txt; then
            :
          else
            audit_status=$?
            if [[ "$audit_status" -eq 1 ]]; then
              echo "::warning::Known vulnerabilities were found in the MLflow/jobs/serving dependency set."
            else
              exit "$audit_status"
            fi
          fi

  semgrep:
    name: Semgrep Python and YAML scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.185.0

      - name: Scan Python and YAML files
        run: >-
          semgrep scan
          --config p/default
          --severity ERROR
          --error
          --metrics=off
          --include '*.py'
          --include '*.yaml'
          --include '*.yml'
          .

  terraform-validation:
    name: Terraform formatting, validation and TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Terraform
        # hashicorp/setup-terraform v4.0.1
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Set up TFLint
        # terraform-linters/setup-tflint v6.3.2
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: v0.66.0

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize and validate every Terraform stack
        shell: bash
        run: |
          set -euo pipefail
          for stack in bootstrap infra platform; do
            terraform -chdir="terraform/${stack}" init -backend=false -input=false
            terraform -chdir="terraform/${stack}" validate -no-color
          done

      - name: Run TFLint
        run: tflint --recursive --minimum-failure-severity=error

  checkov:
    name: Checkov Terraform security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.4.3

      - name: Scan Terraform source 
        # Keep every finding visible in the logs while making Terraform remediation non-blocking.
        run: >-
          checkov
          --directory terraform
          --framework terraform
          --soft-fail

  trivy-filesystem:
    name: Trivy repository secrets and configuration scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Scan the full repository for secrets
        # Trivy v0.76.2; source-tree dependency vulnerabilities are audited separately.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL
          exit-code: "1"

      - name: Scan non-Terraform files for configuration misconfigurations
        # Terraform misconfiguration is owned by the Checkov job above.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          skip-dirs: terraform
          scanners: misconfig
          severity: CRITICAL
          exit-code: "1"

  helm-validation:
    name: Helm lint and template validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Helm 3
        # Azure/setup-helm v5.1.0
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v3.22.1

      - name: Lint and render Argo CD Application chart
        run: |
          helm lint deploy/argocd \
            --set-string repoURL=ci-repository-placeholder \
            --set-string targetRevision=main \
            --set-string mlflowImageRepository=ci-registry-placeholder/mlflowops/mlflow \
            --set-string mlflowRegion=ci-region-1 \
            --set-string servingImageRepository=ci-registry-placeholder/mlflowops/serving \
            --set-string certificateArn=ci-placeholder-certificate \
            --set-json 'publicSubnetCidrs=["10.0.0.0/24"]'
          helm template ci deploy/argocd \
            --namespace argocd \
            --set-string repoURL=ci-repository-placeholder \
            --set-string targetRevision=main \
            --set-string mlflowImageRepository=ci-registry-placeholder/mlflowops/mlflow \
            --set-string mlflowRegion=ci-region-1 \
            --set-string servingImageRepository=ci-registry-placeholder/mlflowops/serving \
            --set-string certificateArn=ci-placeholder-certificate \
            --set-json 'publicSubnetCidrs=["10.0.0.0/24"]' >/dev/null
          # Render optional child Applications too; this does not enable them in Git.
          helm template ci-enabled deploy/argocd \
            --namespace argocd \
            --set-string repoURL=ci-repository-placeholder \
            --set-string targetRevision=main \
            --set-string mlflowImageRepository=ci-registry-placeholder/mlflowops/mlflow \
            --set-string mlflowRegion=ci-region-1 \
            --set-string servingImageRepository=ci-registry-placeholder/mlflowops/serving \
            --set-string certificateArn=ci-placeholder-certificate \
            --set-json 'publicSubnetCidrs=["10.0.0.0/24"]' \
            --set applications.servingStaging.enabled=true \
            --set applications.servingProduction.enabled=true >/dev/null

      - name: Lint and render foundation and workload charts
        run: |
          set -euo pipefail

          helm lint deploy/charts/argocd-bootstrap \
            --set-string repoURL=ci-repository-placeholder \
            --set-string targetRevision=main \
            --set-string mlflowImageRepository=ci-registry-placeholder/mlflowops/mlflow \
            --set-string mlflowRegion=ci-region-1 \
            --set-string servingImageRepository=ci-registry-placeholder/mlflowops/serving \
            --set-string certificateArn=ci-placeholder-certificate \
            --set-json 'publicSubnetCidrs=["10.0.0.0/24"]'
          helm template ci deploy/charts/argocd-bootstrap --namespace argocd \
            --set-string repoURL=ci-repository-placeholder \
            --set-string targetRevision=main \
            --set-string mlflowImageRepository=ci-registry-placeholder/mlflowops/mlflow \
            --set-string mlflowRegion=ci-region-1 \
            --set-string servingImageRepository=ci-registry-placeholder/mlflowops/serving \
            --set-string certificateArn=ci-placeholder-certificate \
            --set-json 'publicSubnetCidrs=["10.0.0.0/24"]' >/dev/null

          helm lint deploy/charts/db-bootstrap
          helm template ci deploy/charts/db-bootstrap --namespace ml-jobs >/dev/null

          helm lint deploy/charts/karpenter-config
          helm template ci deploy/charts/karpenter-config --namespace kube-system >/dev/null

          helm lint deploy/charts/ml-jobs
          helm template ci deploy/charts/ml-jobs --namespace ml-jobs >/dev/null

          helm lint deploy/charts/mlflow \
            --set-string artifacts.bucket=ci-artifacts-bucket \
            --set-string image.repository=ci-registry-placeholder/mlflowops/mlflow \
            --set-string image.tag=ci \
            --set-string region=ci-region-1
          helm template ci deploy/charts/mlflow \
            --namespace mlflow \
            --set-string artifacts.bucket=ci-artifacts-bucket \
            --set-string image.repository=ci-registry-placeholder/mlflowops/mlflow \
            --set-string image.tag=ci \
            --set-string region=ci-region-1 >/dev/null

          helm lint deploy/charts/platform-base \
            --set-string artifactsBucket=ci-artifacts-bucket \
            --set-string rdsMasterSecretArn=ci-placeholder-secret-ref
          helm template ci deploy/charts/platform-base \
            --namespace kube-system \
            --set-string artifactsBucket=ci-artifacts-bucket \
            --set-string rdsMasterSecretArn=ci-placeholder-secret-ref >/dev/null

      - name: Lint and render staging serving chart
        run: |
          helm lint deploy/charts/serving \
            --values deploy/charts/serving/values-staging.yaml \
            --set-string image.repository=ci-registry-placeholder/mlflowops/serving \
            --set-string image.tag=ci
          helm template ci deploy/charts/serving \
            --namespace staging \
            --values deploy/charts/serving/values-staging.yaml \
            --set-string image.repository=ci-registry-placeholder/mlflowops/serving \
            --set-string image.tag=ci >/dev/null

      - name: Lint and render production serving chart
        run: |
          helm lint deploy/charts/serving \
            --values deploy/charts/serving/values-production.yaml \
            --set-string image.repository=ci-registry-placeholder/mlflowops/serving \
            --set-string image.tag=ci \
            --set-string gateway.certificateArn=ci-placeholder-certificate \
            --set-json networkPolicy.publicSubnetCidrs='["10.0.0.0/24"]'
          helm template ci deploy/charts/serving \
            --namespace production \
            --values deploy/charts/serving/values-production.yaml \
            --set-string image.repository=ci-registry-placeholder/mlflowops/serving \
            --set-string image.tag=ci \
            --set-string gateway.certificateArn=ci-placeholder-certificate \
            --set-json networkPolicy.publicSubnetCidrs='["10.0.0.0/24"]' >/dev/null

  changes:
    name: Detect image-relevant changes
    runs-on: ubuntu-latest
    outputs:
      images_changed: ${{ steps.filter.outputs.images_changed }}
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect image-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          images_changed=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            images_changed=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              images_changed=true
            elif ! git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" >/tmp/image-release-changed-files.txt; then
              images_changed=true
            else
              image_paths_re='^(images/|constraints/|serving/app/|serving/requirements\.txt$|jobs/[^/]+\.py$|model/[^/]+\.py$|model/requirements\.txt$|Dockerfile$|\.dockerignore$|\.github/workflows/image-release\.yml$)'
              if grep -Eq "$image_paths_re" /tmp/image-release-changed-files.txt; then
                images_changed=true
              fi
            fi
          fi

          echo "Image-relevant changes: $images_changed"
          echo "images_changed=$images_changed" >> "$GITHUB_OUTPUT"

  image-release:
    name: Image release
    needs:
      - changes
      - python-tests
      - dependency-audit
      - semgrep
      - terraform-validation
      - checkov
      - trivy-filesystem
      - helm-validation
    if: needs.changes.outputs.images_changed == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/image-release.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
